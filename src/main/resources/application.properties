# ---- Database ----
# Create a MySQL database named learning_path_db before running, or change these values.
spring.datasource.url=jdbc:mysql://localhost:3306/learning_path_db?createDatabaseIfNotExist=true
spring.datasource.username=
spring.datasource.password=

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Auto-creates/updates tables from the entity classes. Fine for a portfolio project;
# use Flyway/Liquibase migrations instead if this grows into something real.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- LLM (OpenAI-compatible) ----
# Set this as an environment variable - never commit a real key to git.
openai.api.key=
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4o-mini

# ---- Server ----
server.port=8080
